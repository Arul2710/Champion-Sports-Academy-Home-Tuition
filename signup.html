<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Champion Sports Academy</title>
    <meta name="description" content="Create your Parent or Admin account for Champion Sports Academy.">
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#2563EB',
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        },
                        secondary: '#1E3A8A',
                        accent: '#38BDF8',
                        surface: '#EFF6FF',
                        ink: '#1E293B',
                        night: '#0F172A'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* RTL toggle support */
        [dir="rtl"] .rtl-flip {
            transform: scaleX(-1);
        }
        [dir="rtl"] .rtl-text {
            display: inline-block;
            transform: scaleX(-1);
        }
        /* Clean centered layout */
        body {
            background: #f8fafc;
        }
        .dark body {
            background: #0f172a;
        }
        .signup-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .signup-card {
            width: 100%;
            max-width: 28rem;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            position: relative;
        }
        .dark .signup-card {
            background: #0f172a;
            border: 1px solid #1e293b;
        }
        .form-controls {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 30;
        }
        @media (max-width: 640px) {
            .form-controls {
                top: 1rem;
                right: 1rem;
            }
        }
        @media (max-width: 480px) {
            .signup-card {
                padding: 1.5rem;
            }
            .form-controls {
                top: 0.75rem;
                right: 0.75rem;
            }
        }
        /* subtle accent for terms checkbox */
        .terms-checkbox {
            accent-color: #2563eb;
        }
        /* toast animation */
        .custom-toast {
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased font-sans">

    <!-- Centered signup form container -->
    <div class="signup-wrapper">
        <div class="signup-card">
            <!-- Top-right control buttons: RTL + dark mode toggle -->
            <div class="form-controls">
                <button id="rtl-toggle" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center justify-center" title="Toggle RTL">
                    <i class="fa-solid fa-right-left text-sm"></i>
                </button>
                <button id="theme-toggle" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center justify-center" title="Toggle dark mode">
                    <i class="fa-solid fa-moon dark:hidden text-sm"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-sm"></i>
                </button>
            </div>

            <!-- Academy Logo -->
            <a href="index.html" class="inline-flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-800 via-blue-600 to-sky-400 flex items-center justify-center text-white text-lg font-black shadow-md">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <div>
                    <span class="block text-lg font-black text-slate-900 dark:text-white uppercase tracking-tight">Champion</span>
                    <span class="block text-[10px] font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Sports Academy</span>
                </div>
            </a>

            <div class="space-y-6">
                <div>
                    <h1 class="text-2xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Create Account</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Join as a Parent or Admin to manage athletes and schedules.</p>
                </div>

                

                <!-- SIGNUP FORM -->
                <form id="signup-form" class="space-y-4" novalidate>
                    <!-- Full Name -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 dark:text-slate-300 mb-1.5">Full Name</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="fullname-input" required placeholder="John Doe" class="w-full p-3 pl-10 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 dark:text-slate-300 mb-1.5">Email Address</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="email" id="signup-email" required placeholder="parent@sportsacademy.com" class="w-full p-3 pl-10 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 dark:text-slate-300 mb-1.5">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" id="signup-password" required placeholder="••••••••" class="w-full p-3 pl-10 pr-10 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <button type="button" class="toggle-password-btn absolute right-3 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                <i class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-1">Minimum 6 characters</p>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 dark:text-slate-300 mb-1.5">Confirm Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="password" id="signup-confirm-password" required placeholder="••••••••" class="w-full p-3 pl-10 pr-10 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <button type="button" class="toggle-password-btn absolute right-3 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">
                                <i class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    

                    <!-- Terms & Conditions -->
                    <div class="flex items-start space-x-2">
                        <input type="checkbox" id="terms-checkbox" required class="terms-checkbox mt-0.5 rounded text-blue-600 focus:ring-blue-500">
                        <label for="terms-checkbox" class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                            I agree to the <a href="terms.html" class="text-blue-600 dark:text-sky-400 font-bold hover:underline">Terms of Service</a> and <a href="privacy-policy.html" class="text-blue-600 dark:text-sky-400 font-bold hover:underline">Privacy Policy</a>.
                        </label>
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider shadow-md transition-all">
                        Create Account
                    </button>
                </form>

                <!-- Social Sign-Up Dividers -->
                <div class="relative py-2 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
                    <span class="relative px-3 bg-white dark:bg-slate-900 text-[10px] font-bold uppercase text-slate-400">Or Sign Up With</span>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <button onclick="showToast('Demo Google signup initialized...', 'info')" class="py-2.5 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors">
                        <i class="fa-brands fa-google text-rose-500 mr-2"></i> Google
                    </button>
                    <button onclick="showToast('Demo Facebook signup initialized...', 'info')" class="py-2.5 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors">
                        <i class="fa-brands fa-facebook-f text-blue-600 mr-2"></i> Facebook
                    </button>
                    <button onclick="showToast('Demo Apple signup initialized...', 'info')" class="py-2.5 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors">
                        <i class="fa-brands fa-apple text-slate-900 dark:text-white mr-2"></i> Apple
                    </button>
                </div>

                <p class="text-center text-xs text-slate-500 dark:text-slate-400">
                    Already have an account? <a href="login.html" class="text-blue-600 dark:text-sky-400 font-bold hover:underline">Sign In</a>
                </p>
            </div>

            <!-- Footer copyright (inside card) -->
            <div class="text-[11px] text-slate-400 dark:text-slate-500 text-center mt-6 pt-4 border-t border-slate-200 dark:border-slate-800">
                &copy; 2026 Champion Sports Academy. All rights reserved.
            </div>
        </div>
    </div>

    <!-- Scripts (inline for self-containment) -->
    <script>
        // ---------- TOAST SYSTEM ----------
        function showToast(message, type = 'info') {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `custom-toast fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] px-5 py-3 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'info' ? 'bg-blue-600' : 'bg-slate-800'}`;
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // ---------- THEME TOGGLE (dark mode) ----------
        const themeToggle = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // ---------- RTL TOGGLE ----------
        const rtlToggle = document.getElementById('rtl-toggle');
        function setDirection(dir) {
            document.documentElement.dir = dir;
            localStorage.setItem('dir', dir);
        }
        if (localStorage.getItem('dir') === 'rtl') {
            setDirection('rtl');
        } else {
            setDirection('ltr');
        }
        rtlToggle.addEventListener('click', () => {
            const currentDir = document.documentElement.dir || 'ltr';
            setDirection(currentDir === 'rtl' ? 'ltr' : 'rtl');
        });

        // ---------- PASSWORD TOGGLE (eye icons) ----------
        document.querySelectorAll('.toggle-password-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // ---------- DEMO CREDENTIALS (quick fill) ----------
        const demoParentBtn = document.getElementById('demo-parent-btn');
        const demoAdminBtn = document.getElementById('demo-admin-btn');
        const fullNameInput = document.getElementById('fullname-input');
        const emailInput = document.getElementById('signup-email');
        const passwordInput = document.getElementById('signup-password');
        const confirmInput = document.getElementById('signup-confirm-password');
        const roleRadios = document.querySelectorAll('input[name="role"]');

        demoParentBtn?.addEventListener('click', () => {
            fullNameInput.value = 'Priya Sharma';
            emailInput.value = 'parent@sportsacademy.com';
            passwordInput.value = 'parent123';
            confirmInput.value = 'parent123';
            document.querySelector('input[name="role"][value="parent"]').checked = true;
            document.getElementById('terms-checkbox').checked = true;
            showToast('Parent demo details filled', 'info');
        });

        demoAdminBtn?.addEventListener('click', () => {
            fullNameInput.value = 'Arjun Mehta';
            emailInput.value = 'admin@sportsacademy.com';
            passwordInput.value = 'admin123';
            confirmInput.value = 'admin123';
            document.querySelector('input[name="role"][value="admin"]').checked = true;
            document.getElementById('terms-checkbox').checked = true;
            showToast('Admin demo details filled', 'info');
        });

        // ---------- SIGNUP FORM SUBMIT ----------
        const signupForm = document.getElementById('signup-form');
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const fullname = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const pwd = passwordInput.value.trim();
            const confirm = confirmInput.value.trim();
            const termsChecked = document.getElementById('terms-checkbox').checked;
            const role = document.querySelector('input[name="role"]:checked')?.value || 'parent';

            // Basic validation
            if (!fullname || !email || !pwd || !confirm) {
                showToast('Please fill in all fields.', 'error');
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address.', 'error');
                return;
            }
            if (pwd.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }
            if (pwd !== confirm) {
                showToast('Passwords do not match.', 'error');
                return;
            }
            if (!termsChecked) {
                showToast('You must agree to the Terms & Privacy Policy.', 'error');
                return;
            }

            // Success simulation
            showToast(`Account created as ${role}! Redirecting... (demo)`, 'info');
            // In a real app, you'd redirect after API call
            // signupForm.reset();
        });

        // optional: prevent actual navigation for demo links
        console.log('Champion Sports Academy – signup page ready.');
    </script>
</body>
</html>
